<!doctype html>
<!-- Plantilla visual de la "chispa del día" para el build in public (paso 7).
     Generada desde plantilla-visual.src.html + chispas-del-dia.md con generar.py. Editá la fuente y regenerá.
     Uso: abrila en Chrome al 100%, elegí chispa, formato y tema, y tocá "Descargar PNG" (o capturá el nodo #card desde las DevTools).
     Parámetros: ?n=1..20 · ?formato=x|feed|historia · ?tema=gris|grafito · ?limpio=1 (sin panel). -->
<html lang="es" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chispa del día</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600,100,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../design/system/tokens.css">
<script src="../../design/shared/arte.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--surface-alt);color:var(--ink);font-family:var(--font-text);-webkit-font-smoothing:antialiased}
  svg{display:block}
  .panel{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px;background:var(--surface);border-bottom:1px solid var(--border);font:500 15px/1.3 var(--font-text)}
  .panel label{display:flex;gap:6px;align-items:center}
  .panel select{max-width:calc(100vw - 120px)}
  .panel label{max-width:100%;min-width:0}
  .panel select,.panel button{font:inherit;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--bg);color:var(--ink)}
  .panel button{background:var(--accent);color:var(--on-accent);border-color:var(--accent);border-radius:var(--radius-full);display:flex;gap:8px;align-items:center}
  .panel button i{width:8px;height:8px;border-radius:50%;background:var(--spark)}
  .panel .hint{color:var(--ink-muted);font-size:13px;flex-basis:100%}
  .stage{padding:24px 16px;overflow:auto}
  .scaler{transform-origin:top left}

  /* ---------- La tarjeta ---------- */
  .card{--muted:var(--ink-muted);position:relative;overflow:hidden;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  .card .n-dormant{fill:var(--surface-alt)}.card .n-link{fill:var(--border)}.card .n-active{fill:var(--ink)}.card .n-impulse{fill:var(--info-text)}.card .n-spark{fill:var(--spark)}
  .net{position:absolute;left:0;right:0;top:0;pointer-events:none;-webkit-mask-image:linear-gradient(#000 0,#000 40%,transparent 100%);mask-image:linear-gradient(#000 0,#000 40%,transparent 100%)}
  .net svg{width:100%;height:100%}
  .card > :not(.net){position:relative}
  .kicker{font:600 var(--k) var(--font-text);color:var(--muted);letter-spacing:.01em}
  .clash{font:600 var(--clash)/1.1 var(--font-display);font-variation-settings:"SOFT" 100;font-feature-settings:"lnum","tnum";margin:0}
  .pair{display:flex;gap:var(--gap)}
  .pair > div{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px}
  .pair .r{text-align:right;align-items:flex-end}
  .dom{font:500 var(--dom)/1.2 var(--font-text);color:var(--muted)}
  .idea{font:400 var(--idea)/1.3 var(--font-text)}
  .syn{margin:0 auto}
  .syn svg{width:100%;height:auto}
  .title{font:600 var(--title)/1.12 var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;letter-spacing:-.01em;margin:0;text-wrap:balance}
  .body{font:400 var(--body)/1.35 var(--font-text);margin:0;color:var(--info-text)}
  .sign{display:flex;align-items:center;gap:16px;margin-top:auto}
  .sign .mark{flex:none}
  .word{display:flex;align-items:baseline;gap:5px;font:600 var(--word)/1 var(--font-display);font-variation-settings:"SOFT" 100;flex:none}
  .word i{width:calc(var(--word) / 4);height:calc(var(--word) / 4);border-radius:50%;background:var(--spark);flex:none}
  .tag{margin-left:auto;font:500 var(--dom)/1.2 var(--font-text);color:var(--muted);text-align:right}

  /* Formatos */
  .card.f-x{width:1600px;height:900px;padding:72px 96px;gap:28px;--k:28px;--clash:64px;--gap:64px;--dom:26px;--idea:30px;--title:60px;--body:32px;--word:44px}
  .card.f-x .net{height:520px}
  .card.f-x .syn{width:420px;margin:-8px auto -4px}
  .card.f-x .mark{width:90px}
  .card.f-feed{width:1080px;height:1350px;padding:104px 88px 88px;gap:36px;--k:30px;--clash:72px;--gap:48px;--dom:28px;--idea:34px;--title:76px;--body:38px;--word:52px}
  .card.f-feed .net{height:700px}
  .card.f-feed .syn{width:640px}
  .card.f-feed .mark{width:110px}
  .card.f-historia{width:1080px;height:1920px;padding:220px 88px 240px;gap:48px;--k:34px;--clash:84px;--gap:48px;--dom:32px;--idea:40px;--title:96px;--body:44px;--word:64px}
  .card.f-historia .net{height:1000px}
  .card.f-historia .syn{width:820px}
  .card.f-historia .mark{width:140px}
  .limpio .panel{display:none}
  .limpio .stage{padding:0}
</style></head>
<body>
<div class="panel">
  <label>Chispa <select id="n"></select></label>
  <label>Formato <select id="formato"><option value="x">X · 1600×900</option><option value="feed">Feed · 1080×1350</option><option value="historia">Historia / Reels · 1080×1920</option></select></label>
  <label>Tema <select id="tema"><option value="gris">Gris (default)</option><option value="grafito">Grafito</option></select></label>
  <button id="png" type="button"><i></i>Descargar PNG</button>
  <span class="hint">La vista está achicada para que entre en pantalla; el PNG sale a tamaño real. Los textos se pueden editar tocándolos.</span>
</div>
<div class="stage"><div class="scaler" id="scaler">
  <div class="card f-x" id="card">
    <div class="net" data-art="red-historia"></div>
    <div class="kicker" id="kicker" contenteditable></div>
    <h1 class="clash" id="clash" contenteditable></h1>
    <div class="pair">
      <div><span class="dom" id="da" contenteditable></span><span class="idea" id="ia" contenteditable></span></div>
      <div class="r"><span class="dom" id="db" contenteditable></span><span class="idea" id="ib" contenteditable></span></div>
    </div>
    <div class="syn" data-art="sinapsis-completa"></div>
    <h2 class="title" id="title" contenteditable></h2>
    <p class="body" id="body" contenteditable></p>
    <div class="sign">
      <div class="mark" data-art="marca"></div>
      <div class="word">Lumbre<i></i></div>
      <div class="tag">Donde se encienden las ideas</div>
    </div>
  </div>
</div></div>
<script>
const CHISPAS = [
 {
  "clash": "Onda verde × code review",
  "da": "Ingeniería",
  "ia": "los semáforos coordinados dejan pasar una columna de autos a velocidad constante, sin frenar en ninguna esquina.",
  "db": "Tecnología",
  "ib": "un pull request pasa más tiempo esperando revisión que siendo revisado.",
  "title": "Revisiones en onda verde",
  "body": "Escalonar ventanas fijas de revisión a lo largo del día, para que un PR que sale a las 10 encuentre a alguien en verde cada dos horas. Lo que acelera no es revisar más rápido: es no frenar."
 },
 {
  "clash": "Ciclones × bandeja de entrada",
  "da": "Ingeniería",
  "ia": "un flujo en espiral separa partículas por su masa, sin filtro: lo pesado cae al centro y lo liviano sale por arriba.",
  "db": "Negocios",
  "ib": "las reglas de filtro del mail se rompen apenas cambia quién te escribe.",
  "title": "Inbox ciclónico",
  "body": "En vez de reglas por remitente, una sola vista que ordena por peso: quién está esperando una respuesta tuya. Lo que nadie espera sale solo por el costado."
 },
 {
  "clash": "Fermentación × borradores",
  "da": "Cocina",
  "ia": "la fermentación trabaja sola si le das sal, tiempo y oscuridad.",
  "db": "Literatura",
  "ib": "la segunda lectura de un texto encuentra lo que la primera no podía ver.",
  "title": "Borradores en salmuera",
  "body": "Escribí la primera versión, dejale una sola nota con lo que querías decir y no la abras por 7 días. El tiempo hace el trabajo que hoy le pedís a la fuerza de voluntad."
 },
 {
  "clash": "Quemas controladas × deuda técnica",
  "da": "Clima y medio ambiente",
  "ia": "las quemas chicas y planificadas evitan el incendio grande que nadie controla.",
  "db": "Tecnología",
  "ib": "la deuda técnica no explota de golpe; se acumula hasta que un cambio chico tarda un mes.",
  "title": "Viernes de quema",
  "body": "Un viernes por mes se borra algo a propósito: una feature que nadie usa, una dependencia, un flag viejo. Incendios chicos y con fecha para que no llegue el grande."
 },
 {
  "clash": "Feromonas × navegación",
  "da": "Biología y naturaleza",
  "ia": "las hormigas refuerzan los caminos que más se usan y los demás se borran solos.",
  "db": "Diseño",
  "ib": "los menús los decide el equipo una vez y no cambian aunque nadie toque la mitad.",
  "title": "Menús con feromona",
  "body": "Los atajos se reordenan según los caminos más transitados del mes, y lo que nadie usa se desvanece de a poco en vez de desaparecer de un día para el otro."
 },
 {
  "clash": "Rotación de cultivos × calendario de contenido",
  "da": "Biología y naturaleza",
  "ia": "alternar cultivos regenera el suelo; repetir el mismo lo agota.",
  "db": "Marketing y comunicación",
  "ib": "el formato que funcionó se repite hasta que deja de funcionar.",
  "title": "Rotación de formatos",
  "body": "Nunca el mismo formato dos semanas seguidas: hilo, video, newsletter y una semana de barbecho. La audiencia, como el suelo, se cansa de lo mismo antes de que lo notes en los números."
 },
 {
  "clash": "Kintsugi × changelog",
  "da": "Arte",
  "ia": "el kintsugi repara la cerámica con oro y deja la rotura a la vista.",
  "db": "Tecnología",
  "ib": "los changelogs dicen \"arreglos menores\" y esconden lo que se rompió.",
  "title": "Changelog dorado",
  "body": "Contá cada bug arreglado con nombre y detalle: qué falló, a quién le pasó, cómo lo arreglaste. Un error reparado a la vista da más confianza que un producto que parece no fallar nunca."
 },
 {
  "clash": "Leitmotiv × onboarding",
  "da": "Música y sonido",
  "ia": "en el cine, un tema vuelve cada vez que aparece un personaje, y lo reconocés antes de verlo.",
  "db": "Diseño",
  "ib": "el usuario nuevo no distingue lo importante de lo accesorio.",
  "title": "El leitmotiv del producto",
  "body": "Un sonido o una animación chiquita que aparece siempre y solo cuando pasa lo importante. A la tercera vez, el usuario lo siente antes de leerlo."
 },
 {
  "clash": "Cuarentena × carrito de compras",
  "da": "Historia y arqueología",
  "ia": "los barcos esperaban cuarenta días antes de desembarcar; lo que seguía sano, bajaba.",
  "db": "Psicología y comportamiento",
  "ib": "las ganas de comprar algo bajan mucho en las primeras 48 horas.",
  "title": "Carrito en cuarentena",
  "body": "Todo lo que querés comprar por encima de cierto monto espera 40 horas en una lista. Si después de eso todavía lo querés, desembarca."
 },
 {
  "clash": "Vacunas × objeciones de venta",
  "da": "Salud y medicina",
  "ia": "una vacuna enseña al cuerpo con una versión débil del virus, para que la fuerte no lo tome por sorpresa.",
  "db": "Negocios",
  "ib": "la objeción que más cuesta es la que aparece al final, cuando el cliente ya decidió.",
  "title": "Vacuna de objeciones",
  "body": "Al principio de la demo, nombrá vos la versión débil de la peor objeción: \"sí, es más caro que X, y por eso…\". Cuando aparezca la fuerte, ya hay anticuerpos."
 },
 {
  "clash": "Mise en place × reuniones",
  "da": "Cocina",
  "ia": "en una cocina profesional nada se prende hasta que todo está cortado y a mano.",
  "db": "Negocios",
  "ib": "la mitad de una reunión se va en buscar el dato que alguien no trajo.",
  "title": "Reuniones con mise en place",
  "body": "Cada persona entra con su parte ya cortada: el dato, la pregunta o la decisión que trae. Si falta algo, la reunión no se prende y se mueve."
 },
 {
  "clash": "Vuelo en V × open source",
  "da": "Biología y naturaleza",
  "ia": "en la formación en V, el ave de adelante rota y las demás ahorran energía en su estela.",
  "db": "Tecnología",
  "ib": "los proyectos abiertos mueren cuando la persona que mantiene todo se quema.",
  "title": "Liderazgo en V",
  "body": "El rol de punta (triage, releases, responder issues) rota cada mes y los demás vuelan en su estela. Nadie va siempre adelante."
 },
 {
  "clash": "Aperturas de ajedrez × pitch",
  "da": "Juegos y videojuegos",
  "ia": "los ajedrecistas memorizan las aperturas para guardar la creatividad para el medio juego.",
  "db": "Negocios",
  "ib": "un pitch se improvisa entero y se pierde en los primeros 30 segundos.",
  "title": "Pitch con apertura de libro",
  "body": "Los primeros 30 segundos, siempre iguales y ensayados hasta el cansancio. Después, medio juego: preguntas abiertas que cambian según quién tenés enfrente."
 },
 {
  "clash": "Estratos × notas viejas",
  "da": "Historia y arqueología",
  "ia": "en una excavación, lo más viejo está abajo y hay que bajar para encontrarlo.",
  "db": "Educación y aprendizaje",
  "ib": "releemos lo último que anotamos y nunca lo de hace un año.",
  "title": "Excavá tus notas",
  "body": "Una vez por mes, leé solo lo que guardaste hace un año. No lo nuevo: lo de abajo. Ahí está lo que ya pensaste y te olvidaste que pensabas."
 },
 {
  "clash": "Efecto Zeigarnik × series",
  "da": "Psicología y comportamiento",
  "ia": "recordamos mejor lo que quedó sin terminar.",
  "db": "Cine y narrativa audiovisual",
  "ib": "los capítulos terminan en suspenso para que pongas el siguiente.",
  "title": "Cortá en el medio",
  "body": "Terminá la sesión de trabajo a mitad de una oración, no al final de una tarea. Mañana arrancás sin fricción, como el capítulo que te dejó con ganas."
 },
 {
  "clash": "Bimotores × ingresos freelance",
  "da": "Ingeniería",
  "ia": "un avión bimotor puede aterrizar con un solo motor.",
  "db": "Economía y finanzas",
  "ib": "el freelancer con un cliente grande vive bien hasta el día que lo pierde.",
  "title": "Regla del bimotor",
  "body": "Ningún cliente puede ser más del 40% de lo que facturás. Si uno se apaga, el otro te lleva hasta la pista."
 },
 {
  "clash": "Ciudad de 15 minutos × apps",
  "da": "Arquitectura y urbanismo",
  "ia": "en la ciudad de 15 minutos, todo lo de todos los días queda a una caminata.",
  "db": "Diseño",
  "ib": "las apps esconden lo diario detrás de tres menús y ponen adelante lo que se usa una vez.",
  "title": "App de 15 segundos",
  "body": "Todo lo que se hace todos los días, a menos de 15 segundos desde que abrís. Lo de una vez por mes puede vivir en las afueras."
 },
 {
  "clash": "Termostato × hábitos",
  "da": "Física y astronomía",
  "ia": "un termostato corrige poco y seguido, y por eso la temperatura casi no se mueve.",
  "db": "Psicología y comportamiento",
  "ib": "los propósitos de enero corrigen todo de golpe una vez por año.",
  "title": "Hábitos con termostato",
  "body": "Nada de grandes propósitos: un ajuste chico cada domingo según cómo fue la semana. Corregir poco y seguido le gana a corregir mucho y tarde."
 },
 {
  "clash": "Polinización × equipos remotos",
  "da": "Biología y naturaleza",
  "ia": "las abejas llevan polen de una flor a otra sin proponérselo.",
  "db": "Negocios",
  "ib": "en los equipos remotos, cada grupo se encierra en su canal.",
  "title": "Abejas internas",
  "body": "Una persona por semana pasa un día en otro equipo, sin tarea asignada, solo para llevar y traer. Las ideas cruzan cuando alguien se mueve."
 },
 {
  "clash": "Doble ciego × nombres de producto",
  "da": "Salud y medicina",
  "ia": "en un ensayo doble ciego, ni el paciente ni el médico saben qué recibe cada uno, para que la expectativa no tuerza el resultado.",
  "db": "Marketing y comunicación",
  "ib": "el nombre de un producto se elige en una reunión donde todos ya saben qué es.",
  "title": "Nombres a ciegas",
  "body": "Mostrá tres nombres sin decir de qué es el producto ni cuál te gusta, y preguntá qué se imaginan. Si nadie se acerca, el nombre no está trabajando por vos."
 }
];
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
if (q.get('limpio')) document.body.classList.add('limpio');
CHISPAS.forEach((c, i) => $('n').add(new Option(`${i + 1}. ${c.clash}`, i + 1)));
$('n').value = q.get('n') || 1;
$('formato').value = q.get('formato') || 'x';
$('tema').value = q.get('tema') || 'gris';

function render() {
  const c = CHISPAS[$('n').value - 1];
  $('kicker').textContent = `Chispa del día #${$('n').value}`;
  $('clash').textContent = c.clash;
  $('da').textContent = c.da; $('ia').textContent = c.ia;
  $('db').textContent = c.db; $('ib').textContent = c.ib;
  $('title').textContent = c.title; $('body').textContent = c.body;
  $('card').className = 'card f-' + $('formato').value;
  document.documentElement.dataset.theme = $('tema').value === 'grafito' ? 'dark' : 'light';
  fit();
}
function fit() {
  const card = $('card'), w = card.offsetWidth, h = card.offsetHeight;
  const avail = Math.max(320, document.querySelector('.stage').clientWidth - 32);
  const s = q.get('limpio') ? 1 : Math.min(1, avail / w);
  $('scaler').style.transform = `scale(${s})`;
  $('scaler').style.width = w * s + 'px'; $('scaler').style.height = h * s + 'px';
}
['n', 'formato', 'tema'].forEach(id => $(id).addEventListener('change', render));
addEventListener('resize', fit);
$('png').addEventListener('click', async () => {
  if (!window.htmlToImage) { alert('No cargó html-to-image: capturá el nodo #card desde las DevTools.'); return; }
  const card = $('card'), prev = $('scaler').style.transform;
  $('scaler').style.transform = 'none';
  try {
    await document.fonts.ready;
    const url = await htmlToImage.toPng(card, { pixelRatio: 1, width: card.offsetWidth, height: card.offsetHeight });
    const a = document.createElement('a');
    a.download = `chispa-${$('n').value}-${$('formato').value}-${$('tema').value}.png`;
    a.href = url; a.click();
  } finally { $('scaler').style.transform = prev; }
});
document.addEventListener('DOMContentLoaded', () => { window.pintarArte && window.pintarArte(); render(); });
</script>
</body></html>
